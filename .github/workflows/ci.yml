name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # First, because every check below reads openapi/v1.yaml and is only worth
      # as much as that file's currency.
      #
      # What this replaced compared openapi/v1.yaml against openapi/v1.sha256 —
      # two files in this repository, written together by one `make sync-spec`
      # in the other one, so the pair agreed with itself by construction. It
      # could catch a hand-edited spec and could never catch the backend moving
      # on, which is the failure section 14.1 built it for. While it was green
      # the two copies drifted by 214 lines and four /auth endpoints.
      #
      # This compares against the contract on shiftlush-api's main branch. That
      # repository is public, so its spec is a static file over HTTPS: no token,
      # no clone, and no running backend — 14.1's critical rule holds, and the
      # build below still compiles from the copy committed here.
      - name: The contract is the one the backend published
        run: npm run lint:contract

      - name: No Turkish in src
        run: npm run lint:tr

      - name: Every translation key exists
        run: npm run lint:i18n

      # Runs after the contract check above, so it reads the contract the
      # backend actually published rather than a stale copy.
      - name: Every API error code has a Turkish message
        run: npm run lint:errors

      # A slashless router path is answered with a 301, and a browser turns a
      # redirected POST into a GET — the write is dropped and nothing throws.
      - name: Every API path the client calls exists
        run: npm run lint:paths

      # Thirty-one buttons shipped that did nothing when pressed. They type-check,
      # they build, they render, and the only signal is a user pressing one — the
      # most expensive place in the pipeline to find out. Buttons already dead when
      # this landed are listed in scripts/dead-button-baseline.json against the
      # branch fixing each; that list is only allowed to shrink.
      - name: Every button does something
        run: npm run lint:buttons

      # Whether a user stays signed in: the refresh cycle, the one retry, the
      # collapsing that stops ten concurrent requests replaying a rotated
      # refresh token and getting every session revoked. None of it is visible
      # on a good connection with a fresh token, so none of it is reachable by
      # the render check below — it needs a failing network, on purpose.
      - name: The session logic holds
        run: npm test

      # The same guarantee the backend gives its own schema: the types are
      # generated, so a hand-edited generated.ts would silently disagree with
      # the contract every screen is written against.
      - name: Generated types match the contract
        run: |
          npm run api:generate
          git diff --exit-code src/api/generated.ts

      # An error report is the one place this application's data can leave it
      # without anybody deciding that it should. Sentry's own quickstart leaves
      # collection on; this plants a national identity number, a password and
      # two live tokens in the channels the SDK collects through and fails if
      # any of them reaches the transport.
      - name: Nothing sensitive leaves in a crash report
        run: npm run test:privacy

      - name: Build
        run: npm run build

      - name: Every route renders
        run: npm run smoke
