name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: No Turkish in src
        run: npm run lint:tr

      - name: Every translation key exists
        run: npm run lint:i18n

      # Runs after the checksum check above, so it reads the contract the
      # backend actually published rather than a stale copy.
      - name: Every API error code has a Turkish message
        run: npm run lint:errors

      # The same guarantee the backend gives its own schema: the types are
      # generated, so a hand-edited generated.ts would silently disagree with
      # the contract every screen is written against.
      - name: Generated types match the contract
        run: |
          npm run api:generate
          git diff --exit-code src/api/generated.ts

      - name: Build
        run: npm run build

      - name: Every route renders
        run: npm run smoke

      - name: The contract matches the backend
        # Both repositories hold a copy of the generated spec. Without this the
        # two drift apart silently and the frontend builds against a contract
        # the backend stopped serving.
        run: |
          echo "$(cat openapi/v1.sha256)  openapi/v1.yaml" | shasum -a 256 -c - \
            || (echo "openapi/v1.yaml does not match its checksum. Run 'make sync-spec' in shiftlush-api." && exit 1)
