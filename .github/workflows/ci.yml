name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: No Turkish in src
        run: npm run lint:tr

      - name: Every translation key exists
        run: npm run lint:i18n

      # Runs after the checksum check above, so it reads the contract the
      # backend actually published rather than a stale copy.
      - name: Every API error code has a Turkish message
        run: npm run lint:errors

      # A slashless router path is answered with a 301, and a browser turns a
      # redirected POST into a GET — the write is dropped and nothing throws.
      - name: Every API path the client calls exists
        run: npm run lint:paths

      # Thirty-one buttons shipped that did nothing when pressed. They type-check,
      # they build, they render, and the only signal is a user pressing one — the
      # most expensive place in the pipeline to find out. Buttons already dead when
      # this landed are listed in scripts/dead-button-baseline.json against the
      # branch fixing each; that list is only allowed to shrink.
      - name: Every button does something
        run: npm run lint:buttons

      # The same guarantee the backend gives its own schema: the types are
      # generated, so a hand-edited generated.ts would silently disagree with
      # the contract every screen is written against.
      - name: Generated types match the contract
        run: |
          npm run api:generate
          git diff --exit-code src/api/generated.ts

      # An error report is the one place this application's data can leave it
      # without anybody deciding that it should. Sentry's own quickstart leaves
      # collection on; this plants a national identity number, a password and
      # two live tokens in the channels the SDK collects through and fails if
      # any of them reaches the transport.
      - name: Nothing sensitive leaves in a crash report
        run: npm run test:privacy

      - name: Build
        run: npm run build

      - name: Every route renders
        run: npm run smoke

      - name: The contract matches the backend
        # Both repositories hold a copy of the generated spec. Without this the
        # two drift apart silently and the frontend builds against a contract
        # the backend stopped serving.
        run: |
          echo "$(cat openapi/v1.sha256)  openapi/v1.yaml" | shasum -a 256 -c - \
            || (echo "openapi/v1.yaml does not match its checksum. Run 'make sync-spec' in shiftlush-api." && exit 1)
